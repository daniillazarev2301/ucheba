name: Deploy to VDS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: false
        default: "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          passphrase: ${{ secrets.VDS_SSH_PASSPHRASE }}
          port: ${{ secrets.VDS_PORT || 22 }}
          script: |
            set -euo pipefail
            export PROJECT_DIR=${{ secrets.PROJECT_DIR || '/opt/ucheba' }}
            export REPO_URL=${{ secrets.REPO_URL }}
            export DOMAIN=${{ secrets.DOMAIN }}
            export DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            export DATABASE_URL=${{ secrets.DATABASE_URL || '' }}
            export REDIS_URL=${{ secrets.REDIS_URL }}
            export API_URL=${{ secrets.API_URL }}
            export BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            export CREATE_DB=${{ secrets.CREATE_DB || '1' }}
            export POSTGRES_USER=${{ secrets.POSTGRES_USER || 'ucheba' }}
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'ucheba' }}
            export POSTGRES_DB=${{ secrets.POSTGRES_DB || 'ucheba' }}
            if [[ -z "$DATABASE_URL" && "${CREATE_DB:-1}" == "1" ]]; then
              export DATABASE_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}"
            fi
            if [[ ! -d "$PROJECT_DIR" ]]; then
              sudo mkdir -p "$PROJECT_DIR"
              sudo chown -R "$USER":"$USER" "$PROJECT_DIR"
            fi
            if [[ ! -d "$PROJECT_DIR/.git" ]]; then
              git clone "$REPO_URL" "$PROJECT_DIR"
            else
              cd "$PROJECT_DIR"
              git fetch --all
              git checkout ${{ inputs.ref }}
              git pull
            fi
            cd "$PROJECT_DIR"
            sudo bash scripts/install_vds.sh
